name: Docker Compose Integration Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docker-compose-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        command: [
          "redis-server",
          "--requirepass", "${REDIS_PASSWORD}",
          "--appendonly", "yes"
        ]
        restart: always
        environment:
          REDIS_PASSWORD: ${REDIS_PASSWORD}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          docker compose --version

      - name: Clean up previous containers
        if: always()
        run: docker compose down -v

      - name: Create .env files
        run: |
          cat server/.env.devnet.example > server/.env
          cat ui/.env.devnet.example > ui/.env
          cat worker/.env.devnet.example > worker/.env
          cat integration-test/.env.devnet.example > integration-test/.env

      - name: Build & start dev profile
        run: |
          docker compose -f docker-compose.yml -f docker-compose.override.ci.yml --profile dev up --build -d

      - name: Wait for services
        run: |
          sleep 300
          docker compose ps
          docker compose logs server-dev

      - name: Check server is running
        run: |
          curl --fail http://localhost:3000/health || exit 1

      - name: Check frontend is running
        run: |
          curl --fail http://localhost:3001 || exit 1

      - name: Run integration tests
        run: |
          # docker exec <container> npm run test
          echo "No tests yet"

      - name: Stop services
        if: always()
        run: |
          docker compose down
