name: Deploy

on:
  workflow_dispatch:

jobs:
  docker-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mastermind-server:latest

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/docker/dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mastermind-worker:latest

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd ~/recursive-mastermind-stack
            export GHCR_PAT=${{ secrets.GHCR_PAT }}
            docker login ghcr.io -u stanlou --password-stdin <<< "$GHCR_PAT"
            unset GHCR_PAT
            docker-compose --profile prod pull
            docker-compose --profile prod up -d
