services:
  server-dev:
    profiles: ['devv','test','simulate']
    build:
      context: .
      dockerfile: server/docker/dockerfile.dev
    volumes:
      - ./server/src:/app/src
      - ./server/package.json:/app/package.json
      - ./server/nodemon.json:/app/nodemon.json
    ports:
      - '3000:3000'
    env_file:
      - server/.env
    depends_on:
      - redis
      - db    
    restart: unless-stopped
  server-prod:
    profiles: ['prod']
    build:
      context: .
      dockerfile: server/docker/dockerfile.prod
    volumes:
      - ./server/src:/app/src
    ports:
      - '3000:3000'
    env_file:
      - server/.env
    restart: unless-stopped
  vue-app-dev-client:
    profiles: ['devv']
    build:
      context: .
      dockerfile: ui/docker/dockerfile.dev
    volumes:
      - ./ui/src:/app/src
      - ./ui/index.ts:/app/index.ts
      - ./ui/package.json:/app/package.json
      - ./ui/public:/app/public
    ports:
      - 3001:3001
    tty: true
    stdin_open: true
    env_file:
      - ui/.env

  redis:
    profiles: ['dev','prod','test','simulate']
    image: redis:7.4.2
    volumes:
      - redis_data:/data
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD}",
      "--appendonly", "yes"
    ]
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
  redis-insight:
    profiles: ['dev']
    image: redis/redisinsight:latest
    ports:
      - '5540:5540'
    restart: unless-stopped

  worker-dev-1:
    profiles: ['devv','test','simulate']
    build:
      context: .
      dockerfile: worker/docker/dockerfile.dev
    volumes:
      - ./worker/src:/app/src
    env_file:
      - worker/.env
    environment:
      - name=worker_1
    depends_on:
      - redis
      - db
    restart: always  
  worker-prod-1:
    profiles: ['prod']
    build:
      context: .
      dockerfile: worker/docker/dockerfile.prod
    volumes:
      - ./worker/src:/app/src
    env_file:
      - worker/.env
    environment:
      - name=worker_1
    depends_on:
      - redis
      - db
    restart: always  
  client-worker-1:
    profiles: ['simulate']
    build:
      context: .
      dockerfile: integration-test/docker/dockerfile.dev
    volumes:
      - ./integration-test/src:/app/src
    env_file:
      - integration-test/.env
    environment:
      - name=worker_1
    depends_on:
      - redis
      - db
    restart: always
  game-simulator:
    profiles: ['simulate']
    build:
      context: .
      dockerfile: integration-test/docker/dockerfile.simulator.dev
    volumes:
      - ./integration-test/src:/app/src
    env_file:
      - integration-test/.env
    depends_on:
      - redis
      - db
    restart: always
  db:
    profiles: ["prod","dev",'test','simulate']
    image: mongo:8.0.6
    container_name: db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongodb_data:/data/db
  mongo-express:
    profiles: ["dev"]
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    ports:
      - "8500:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${ME_CONFIG_MONGODB_ADMINUSERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${ME_CONFIG_MONGODB_ADMINPASSWORD}
      ME_CONFIG_MONGODB_SERVER: ${ME_CONFIG_MONGODB_SERVER}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
    depends_on:
      - redis
      - db

volumes:
  redis_data:
  mongodb_data:
